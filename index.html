<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Code Generator</title>
  <link rel="icon" href="https://i.imgur.com/JrjM1jf.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* OSTIGUYTECH STYLE */
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0b0c0f;
  color: #e5e7eb;
}

header {
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #1f2937;
  background: #020617;
}

header h1 {
  font-size: 22px;
  margin-bottom: 6px;
}

header p {
  font-size: 14px;
  color: #9ca3af;
}

/* LAYOUT */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 16px;
}

/* FORM */
label {
  font-size: 13px;
  color: #9ca3af;
}

textarea, select {
  width: 100%;
  background: #0b0c0f;
  border: 1px solid #1f2937;
  color: #e5e7eb;
  border-radius: 6px;
  padding: 10px;
  font-size: 14px;
  margin-top: 6px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

button {
  margin-top: 14px;
  background: #2563eb;
  border: none;
  color: white;
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

/* OUTPUT */
.output {
  background: #000;
  border: 1px solid #1f2937;
  border-radius: 8px;
  padding: 14px;
  font-family: monospace;
  font-size: 13px;
  white-space: pre-wrap;
  min-height: 120px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 12px;
  font-size: 12px;
  color: #9ca3af;
  border-top: 1px solid #1f2937;
  background: #020617;
}
</style>
</head>
<body>

<header>
  <h1>AI Code Generator</h1>
  <p>Generate HTML, CSS, JavaScript & ideas instantly</p>
</header>

<div class="container">

  <div class="card">
    <label>What do you want to generate?</label>
    <textarea id="prompt" placeholder="Example: Create a modern login page with dark mode..."></textarea>

    <label style="margin-top:12px; display:block;">Output type</label>
    <select id="type">
      <option value="html">HTML Page</option>
      <option value="css">CSS Styles</option>
      <option value="js">JavaScript Logic</option>
      <option value="idea">Concept / Idea</option>
    </select>

    <button onclick="generate()">Generate</button>
  </div>

  <div class="card">
    <label>Generated result</label>
    <div class="output" id="output">
Waiting for input…
    </div>
  </div>

</div>

<footer>

</footer>

<script>
function generate() {
  const prompt = document.getElementById("prompt").value.trim();
  const type = document.getElementById("type").value;
  const output = document.getElementById("output");

  if (!prompt) {
    output.textContent = "Please describe what you want to generate.";
    return;
  }

  // DEMO AI RESPONSE (offline simulation)
  let result = "";

  if (type === "html") {
    result = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Generated Page</title>
</head>
<body>
  <h1>${prompt}</h1>
  <p>This HTML structure was generated automatically.</p>
</body>
</html>`;
  }

  if (type === "css") {
    result = `body {
  background: #0b0c0f;
  color: white;
  font-family: system-ui;
}`;
  }

  if (type === "js") {
    result = `console.log("Generated logic for: ${prompt}");`;
  }

  if (type === "idea") {
    result = `Concept:
${prompt}

• Target users
• Core features
• Monetization ideas
• Security & performance notes`;
  }

  output.textContent = result;
}
</script>

</body>
</html>
