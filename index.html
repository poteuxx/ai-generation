<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Free AI Image Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    background: #0b0b0c;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
}
textarea {
    width: 100%;
    height: 80px;
    font-size: 16px;
    padding: 10px;
    border-radius: 6px;
    border: none;
}
button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    font-size: 16px;
    background: #22c55e;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
img {
    margin-top: 20px;
    max-width: 100%;
    border-radius: 10px;
    display: none;
}
</style>
</head>

<body>
<div class="container">
    <textarea id="prompt" placeholder="Describe the image..."></textarea>
    <button onclick="generate()">Generate</button>
    <img id="img">
</div>

<script>
async function generate() {
    const prompt = document.getElementById("prompt").value;
    if (!prompt) return alert("Enter a prompt");

    const img = document.getElementById("img");
    img.style.display = "none";

    const response = await fetch(
        "https://hf.space/embed/stabilityai/stable-diffusion/+/api/predict/",
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                data: [
                    prompt,
                    "",
                    30,
                    7.5,
                    512,
                    512,
                    1,
                    0,
                    0,
                    false
                ]
            })
        }
    );

    const result = await response.json();

    const imageBase64 = result.data[0];
    img.src = "data:image/png;base64," + imageBase64;
    img.style.display = "block";
}
</script>
</body>
</html>
