<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Generator (No API Key)</title>
<style>
body {
    background:#0b0b0c;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:40px;
}
input, button {
    padding:12px;
    width:80%;
    margin-top:10px;
    font-size:16px;
}
button {
    background:#6a5acd;
    color:white;
    border:none;
    cursor:pointer;
}
img {
    margin-top:30px;
    max-width:90%;
    border-radius:12px;
}
</style>
</head>
<body>

<h1>Image Generator (No API Key)</h1>

<input id="prompt" placeholder="Describe the image you want..." />
<br>
<button onclick="generate()">Generate</button>

<div id="result"></div>

<script>
function generate() {
    const prompt = document.getElementById("prompt").value;
    const result = document.getElementById("result");

    if (!prompt) {
        result.innerHTML = "Please enter a prompt.";
        return;
    }

    // Simulated AI result using Unsplash
    const encodedPrompt = encodeURIComponent(prompt);

    const imageUrl = 
        "https://source.unsplash.com/1024x1024/?" + encodedPrompt;

    result.innerHTML = `
        <p><b>Prompt:</b> ${prompt}</p>
        <img src="${imageUrl}">
    `;
}
</script>

</body>
</html>
